# NOUVEAU : Configuration de déploiement Netlify (site 100% statique)

[build]
  # NOUVEAU : build du bundle esbuild, puis publication du dossier frontend
  command = "cd i-fleur/frontend && npm run build"
  publish = "i-fleur/frontend"

# NOUVEAU : SPA - routes inconnues renvoient vers index.html (inutile ici, vitrine monolithique)
[build.environment]
  NODE_VERSION = "20"
